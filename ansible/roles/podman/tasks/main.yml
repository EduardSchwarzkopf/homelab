---
- name: Configure Podman
  become: true
  block:
    - name: Install Podman prerequisites
      ansible.builtin.import_tasks: prerequisites.yml

    - name: Install Podman
      ansible.builtin.import_tasks: install.yml

    - name: Install extra tools (Buildah, Skopeo)
      ansible.builtin.import_tasks: tools.yml

    - name: Configure registries
      ansible.builtin.import_tasks: registries.yml

    - name: Configure storage
      ansible.builtin.import_tasks: storage.yml

    - name: Configure Podman socket
      ansible.builtin.import_tasks: socket.yml
      when: podman_socket_enabled
