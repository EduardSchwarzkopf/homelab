---
- name: Ensure journald config directory exists
  ansible.builtin.file:
    path: /etc/systemd
    state: directory

- name: Deploy journald config
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf
    mode: "0644"
  notify: Restart journald

- name: Create persistent journal directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    mode: "0755"

- name: Vacuum archived journals (keep last 7 days)
  ansible.builtin.command: journalctl --vacuum-time=7d
  changed_when: false

- name: Add weekly journal vacuum cron job
  ansible.builtin.cron:
    name: journal-vacuum
    week: "*"
    minute: 15
    hour: 3
    job: journalctl --vacuum-time=7d
    state: present
    user: root