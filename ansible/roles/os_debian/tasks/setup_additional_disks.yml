---
- name: Setup additiona disks
  become: true
  block:
    - name: Install required disk tools
      ansible.builtin.apt:
        name:
          - parted
          - e2fsprogs
        state: present

    - name: Create partition on each disk
      community.general.parted:
        device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi{{ item.scsi_num }}"
        number: 1
        label: gpt
        state: present
        part_start: "0%"
        part_end: "100%"
      loop: "{{ os_disks }}"
      loop_control:
        label: "{{ item.mount_path }}"

    - name: Create ext4 filesystem
      community.general.filesystem:
        fstype: ext4
        dev: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi{{ item.scsi_num }}-part1"
        force: false
      loop: "{{ os_disks }}"
      loop_control:
        label: "{{ item.mount_path }}"

    - name: Check current mount point for each disk
      ansible.builtin.shell: |
        lsblk -ln -o MOUNTPOINT "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi{{ item.scsi_num }}-part1" | grep -v '^$' | head -1
      register: current_mounts
      changed_when: false
      loop: "{{ os_disks }}"
      loop_control:
        label: "{{ item.mount_path }}"

    - name: Unmount disk if mounted at wrong location
      ansible.posix.mount:
        path: "{{ current_mounts.results[idx].stdout }}"
        state: unmounted
      loop: "{{ os_disks }}"
      loop_control:
        index_var: idx
        label: "{{ item.mount_path }}"
      when:
        - current_mounts.results[idx].stdout != ""
        - current_mounts.results[idx].stdout != item.mount_path

    - name: Remove old fstab entry if path changed
      ansible.posix.mount:
        path: "{{ current_mounts.results[idx].stdout }}"
        state: absent
      loop: "{{ os_disks }}"
      loop_control:
        index_var: idx
        label: "{{ item.mount_path }}"
      when:
        - current_mounts.results[idx].stdout != ""
        - current_mounts.results[idx].stdout != item.mount_path

    - name: Mount disk at correct location and update fstab
      ansible.posix.mount:
        path: "{{ item.mount_path }}"
        src: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi{{ item.scsi_num }}-part1"
        fstype: ext4
        opts: defaults,nofail
        state: mounted
      loop: "{{ os_disks }}"
      loop_control:
        label: "{{ item.mount_path }}"
