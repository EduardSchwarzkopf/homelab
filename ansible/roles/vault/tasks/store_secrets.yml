# vars example:
# vault_secret_path: "{{ docmost_app_name }}"
# vault_secrets:
#   - key: app_secret
#     length: 48
#   - key: db_password
#     length: 32
#   - key: db_user
#     value: "{{ docmost_db_user }}"
# vault_force_update: false

---
- name: Check if secrets already exist in Vault
  community.hashi_vault.vault_kv2_get:
    engine_mount_point: "{{ vault_mount_path }}"
    path: "{{ vault_secret_path }}"
  register: vault_existing_secrets
  ignore_errors: true
  delegate_to: localhost

- name: Build secret data
  ansible.builtin.set_fact:
    vault_secret_data: >-
      {{
        vault_secret_data | default({}) | combine({
          item.key: (
            item.value
            if item.value is defined and item.value | length > 0
            else lookup('password', '/dev/null length=' + (item.length | default(48) | string))
          )
        })
      }}
  loop: "{{ vault_secrets }}"
  no_log: true

- name: Store secrets in Vault
  community.hashi_vault.vault_kv2_write:
    engine_mount_point: "{{ vault_mount_path }}"
    path: "{{ vault_secret_path }}"
    data: "{{ vault_secret_data }}"
  when: vault_existing_secrets.failed or vault_force_update | default(false)
  no_log: true
  delegate_to: localhost
