---
- name: Install Paperless with podman
  become_user: "{{ paperless_service_user }}"
  become: true
  block:
    - name: Create {{ paperless_app_name }} network
      containers.podman.podman_network:
        name: "{{ paperless_app_name }}"
        state: present
        driver: bridge

    - name: Create {{ paperless_app_name }} redis volume
      containers.podman.podman_volume:
        name: "{{ paperless_app_name }}-redis"
        state: present

    - name: Deploy Redis container
      containers.podman.podman_container:
        name: "{{ paperless_app_name }}-redis"
        image: "{{ paperless_redis_image }}"
        state: started
        restart_policy: always
        network: "{{ paperless_app_name }}"
        volumes:
          - "{{ paperless_app_name }}-redis:/data"
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 10s
          timeout: 5s
          retries: 5

    - name: Get UID user
      command: id -u {{ paperless_service_user }}
      register: paperless_user_uid

    - name: Get GID user
      command: id -g {{ paperless_service_user }}
      register: paperless_user_gid

    - name: Deploy {{ paperless_app_name }} container
      containers.podman.podman_container:
        name: "{{ paperless_app_name }}"
        image: "{{ paperless_image }}"
        state: started
        restart_policy: always
        network: "{{ paperless_app_name }}"
        ports:
          - "{{ paperless_port }}:8000"
        volumes:
          - "{{ paperless_data_dir }}:/usr/src/paperless/data"
          - "{{ paperless_media_dir }}:/usr/src/paperless/media"
          - "{{ paperless_export_dir }}:/usr/src/paperless/export"
          - "{{ paperless_consume_dir }}:/usr/src/paperless/consume"
        env:
          USERMAP_UID: "{{ paperless_user_uid.stdout }}"
          USERMAP_GID: "{{ paperless_user_gid.stdout }}"
          PAPERLESS_REDIS: "redis://{{ paperless_app_name }}-redis:6379"
          PAPERLESS_TIME_ZONE: "{{ paperless_timezone }}"
          PAPERLESS_OCR_LANGUAGE: "{{ paperless_ocr_language }}"
          PAPERLESS_DBENGINE: postgresql
          PAPERLESS_DBHOST: "{{ postgres_host }}"
          PAPERLESS_DBPORT: "{{ postgres_port }}"
          PAPERLESS_DBNAME: "{{ paperless_db_name }}"
          PAPERLESS_DBUSER: "{{ paperless_db_user }}"
          PAPERLESS_DBPASS: "{{ paperless_db_password }}"
          PAPERLESS_SECRET_KEY: "{{ paperless_secret_key }}"
          PAPERLESS_URL: "{{ paperless_url }}"
          PAPERLESS_CORS_ALLOWED_HOSTS: "{{ paperless_url }}"
          PAPERLESS_CSRF_TRUSTED_ORIGINS: "{{ paperless_url }}"
