---
- name: Setup Samba
  become: true
  block:
    - name: Install Samba
      ansible.builtin.apt:
        name: samba
        state: present

    - name: Set Samba password for SMB user
      ansible.builtin.shell: |
        printf '%s\n%s\n' "{{ paperless_smb_password }}" "{{ paperless_smb_password }}" | smbpasswd -a -s "{{ paperless_service_user }}"
      no_log: true
      changed_when: true

    - name: Configure Samba share for consume directory
      ansible.builtin.blockinfile:
        path: /etc/samba/smb.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK - {{ paperless_smb_share_name }}"
        block: |
          [{{ paperless_smb_share_name }}]
            path = {{ paperless_consume_dir }}
            valid users = {{ paperless_service_user }}
            read only = no
            browseable = yes
            create mask = 0660
            directory mask = 0770
            force user = {{ paperless_service_user }}
      notify: Restart smbd

    - name: Enable and start Samba
      ansible.builtin.service:
        name: smbd
        state: started
        enabled: true
