---
- name: Setup databases
  become: true
  become_user: postgres_service_user
  block:
    - name: Setup disks for databases
      ansible.builtin.import_role:
        name: os_debian
        tasks_from: setup_additional_disks.yml
      vars:
        disks:
          - scsi_num: "{{ instance.scsi_num }}"
            mount_path: "{{ instance.data_dir }}"

    - name: Ensure data directory exists for {{ instance.name }}
      ansible.builtin.file:
        path: "{{ instance.data_dir }}"
        state: directory
        owner: "{{ postgres_service_user }}"
        group: "{{ postgres_service_user }}"
        mode: "0700"

    - name: Create Quadlet volume file for {{ instance.name }}
      ansible.builtin.template:
        src: postgres.volume.j2
        dest: "{{ postgres_service_user_home }}/.config/containers/systemd/{{ instance.name }}.volume"
        owner: "{{ postgres_service_user }}"
        group: "{{ postgres_service_user }}"
        mode: "0644"

    - name: Start {{ instance.name }} service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: "{{ instance.name }}"
        state: restarted

    - name: Wait for {{ instance.name }} to be reachable on port {{ instance.port }}
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ instance.port }}"
        state: started
        timeout: 60
        delay: 5
