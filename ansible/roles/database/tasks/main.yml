---
- name: Setup {{ postgres_service_user }} service user
  ansible.builtin.import_role:
    name: podman
    tasks_from: init_podman_user
  vars:
    podman_user:
      name: "{{ postgres_service_user }}"

- name: Generate and store {{ paperless_app_name }} secrets in vault
  ansible.builtin.import_tasks: secrets_generate.yml

- name: fetch and {{ paperless_app_name }} secrets from vault
  ansible.builtin.import_tasks: secrets_fetch.yml

- name: Setup postgres instances
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ postgres_instances }}"
  loop_control:
    loop_var: instance
