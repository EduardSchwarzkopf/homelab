---
- name: Template {{ plane_app_name }} environment file
  become: true
  become_user: "{{ plane_service_user }}"
  ansible.builtin.template:
    src: plane.env.j2
    dest: "{{ plane_base_dir }}/plane.env"
    owner: "{{ plane_service_user }}"
    group: "{{ plane_service_user }}"
    mode: "0600"
  notify: Restart plane services

- name: Remove plane-db.service dependency from quadlet files (external PostgreSQL)
  become: true
  become_user: "{{ plane_service_user }}"
  ansible.builtin.replace:
    path: "{{ plane_quadlets_dir }}/{{ item }}"
    regexp: '(\b(?:Requires|After)=[^\n]*)plane-db\.service ?'
    replace: '\1'
  loop: "{{ plane_container_list }}"
  notify: Reload systemd user daemon

- name: Ensure all plane quadlet units have [Install] WantedBy=default.target
  become: true
  become_user: "{{ plane_service_user }}"
  ansible.builtin.blockinfile:
    path: "{{ plane_quadlets_dir }}/{{ item }}"
    block: |
      [Install]
      WantedBy=default.target
    marker: "# {mark} ANSIBLE MANAGED INSTALL BLOCK"
    insertafter: EOF
  loop: "{{ plane_container_list}}"
  notify: Restart plane services

- name: Ensure plane containers wait for network to be ready
  become: true
  become_user: "{{ plane_service_user }}"
  ansible.builtin.replace:
    path: "{{ plane_quadlets_dir }}/{{ item }}"
    regexp: "^(After=.*)$"
    replace: 'After=\1 network-online.target plane-nw-network.service'
  loop: "{{ plane_container_list}}"

- name: Ensure plane containers require network service
  become: true
  become_user: "{{ plane_service_user }}"
  ansible.builtin.replace:
    path: "{{ plane_quadlets_dir }}/{{ item }}"
    regexp: "^(Requires=.*)$"
    replace: 'Requires=\1 plane-nw-network.service'
  loop: "{{ plane_container_list}}"
