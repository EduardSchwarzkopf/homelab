---
- name: Remove NPM proxy host
  ansible.builtin.import_role:
    name: nginx_proxy_manager
    tasks_from: remove_proxy_hosts.yml
  vars:
    npm_proxy_hosts:
      - domain_names:
          - "{{ docmost_app_domain }}"

- name: Uninstall Docmost
  ansible.builtin.import_tasks: uninstall.yml

- name: Deprovision docmost database
  include_role:
    name: postgres
    tasks_from: deprovision_database.yml
  vars:
    database_name: "{{ docmost_db_name }}"
    database_user: "{{ docmost_db_user }}"

- name: Delete docmost secrets from Vault
  ansible.builtin.import_role:
    name: vault
    tasks_from: delete_secrets.yml
  vars:
    vault_secret_path: "{{ docmost_app_name }}"

- name: Cleanup Server
  become: true
  block:
    - name: Delete file glob
      find:
        paths: "{{ docmost_data_dir }}"
        patterns: "*.*"
      register: docmost_destroy_files_glob

    - name: Remove docmost files
      file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ docmost_destroy_files_glob.files }}"

    - name: Stop and disable lingering for {{ docmost_service_user }}
      command: loginctl disable-linger {{ docmost_service_user }}
      ignore_errors: true

    - name: Terminate all sessions for {{ docmost_service_user }}
      command: loginctl terminate-user {{ docmost_service_user }}
      ignore_errors: true

    - name: Kill any remaining processes for {{ docmost_service_user }}
      shell: "pkill -9 -u {{ docmost_service_user }} || true"

    - name: Wait for processes to fully die
      shell: "pgrep -u {{ docmost_service_user }}"
      register: remaining_procs
      retries: 5
      delay: 2
      until: remaining_procs.rc != 0
      failed_when: false

    - name: Remove user
      ansible.builtin.user:
        name: "{{ docmost_service_user }}"
        state: absent
        remove: true
