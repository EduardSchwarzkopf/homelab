---
- name: Restart service
  become: true
  become_user: "{{ immich_service_user }}"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    daemon_reload: true
    state: restarted
    scope: user
  loop:
    - "{{ immich_app_name }}-redis.service"
    - "{{ immich_app_name }}.service"
  listen: Restart service
