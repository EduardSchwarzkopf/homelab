---
- name: Install docmost with Quadlet
  become: true
  block:
    - name: Ensure Quadlet systemd directory exists
      ansible.builtin.file:
        path: "/home/{{ docmost_service_user }}/.config/containers/systemd"
        state: directory
        owner: "{{ docmost_service_user }}"
        group: "{{ docmost_service_user }}"
        mode: "0755"

    - name: Create Quadlet files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/home/{{ docmost_service_user }}/.config/containers/systemd/{{ item.dest }}"
        owner: "{{ docmost_service_user }}"
        group: "{{ docmost_service_user }}"
        mode: "0644"
      loop:
        - { src: docmost.network.j2, dest: "{{ docmost_app_name }}.network" }
        - {
            src: docmost-redis.volume.j2,
            dest: "{{ docmost_app_name }}-redis.volume",
          }
        - {
            src: docmost-redis.container.j2,
            dest: "{{ docmost_app_name }}-redis.container",
          }
        - {
            src: docmost.container.j2,
            dest: "{{ docmost_app_name }}.container",
          }
      notify: Reload systemd user daemon

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  become: true
  become_user: "{{ docmost_service_user }}"

- name: Enable and start docmost services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    scope: user
  become: true
  become_user: "{{ docmost_service_user }}"
  loop:
    - "{{ docmost_app_name }}-redis.service"
    - "{{ docmost_app_name }}.service"

- name: Wait for {{ docmost_app_name }} to be reachable on port {{ docmost_port }}
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ docmost_port }}"
    state: started
    timeout: 120
    delay: 10

- name: Print {{ docmost_app_name }} status
  ansible.builtin.debug:
    msg: "Docmost is up and listening on {{ ansible_host }}:{{ docmost_port }}"
