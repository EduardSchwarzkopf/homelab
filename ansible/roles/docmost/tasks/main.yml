---
- name: Setup disks for docmost
  ansible.builtin.import_role:
    name: os_debian
    tasks_from: setup_additional_disks.yml
  vars:
    os_disks:
      - scsi_num: 1
        mount_path: "{{ docmost_data_dir }}"

- name: Generate and store docmost secrets in vault
  ansible.builtin.import_tasks: secrets_generate.yml

- name: fetch and docmost secrets from vault
  ansible.builtin.import_tasks: secrets_fetch.yml

- name: Provision docmost database
  include_role:
    name: postgres
    tasks_from: provision_database.yml
  vars:
    database_name: "{{ docmost_db_name }}"
    database_user: "{{ docmost_db_user }}"
    database_user_password: "{{ docmost_db_password }}"

- name: Setup podman user
  ansible.builtin.import_role:
    name: podman
    tasks_from: setup_rootless_users
  vars:
    podman_users:
      - "{{ docmost_service_user }}"

- name: Setup directories
  ansible.builtin.import_tasks: directories.yml

- name: Install Docmost
  ansible.builtin.import_tasks: install.yml

- name: Configure NPM proxy host
  ansible.builtin.import_role:
    name: nginx_proxy_manager
    tasks_from: proxy_hosts.yml
  vars:
    npm_proxy_hosts:
      - domain_names:
          - "{{docmost_app_domain}}"
        forward_host: "{{ ansible_host }}"
        forward_port: "{{ docmost_port }}"
