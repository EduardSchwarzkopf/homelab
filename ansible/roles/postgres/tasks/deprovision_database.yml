- name: Prepare
  ansible.builtin.import_tasks: _prepare.yml

- name: "Check if database {{ database_name }} exists"
  community.postgresql.postgresql_query:
    query: "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'"
    login_host: "{{ postgres_host }}"
    login_port: "{{ postgres_port }}"
    login_user: "{{ database_credentials.db_root_user }}"
    login_password: "{{ database_credentials.db_root_password }}"
  register: db_check
  delegate_to: "{{ postgres_host }}"

- name: "Remove Grant for {{ database_user }} on {{ database_name }}"
  community.postgresql.postgresql_privs:
    login_db: "{{ database_name }}"
    roles: "{{ database_user }}"
    privs: ALL
    type: database
    state: absent
    login_host: "{{ postgres_host }}"
    login_port: "{{ postgres_port }}"
    login_user: "{{ database_credentials.db_root_user }}"
    login_password: "{{ database_credentials.db_root_password }}"
  delegate_to: "{{ postgres_host }}"
  when: db_check.rowcount > 0 # ← skip if DB doesn't exist

- name: "Remove Grant for {{ database_user }} on public schema in {{ database_name }}"
  community.postgresql.postgresql_privs:
    login_db: "{{ database_name }}"
    roles: "{{ database_user }}"
    privs: ALL
    type: schema
    objs: public
    state: absent
    login_host: "{{ postgres_host }}"
    login_port: "{{ postgres_port }}"
    login_user: "{{ database_credentials.db_root_user }}"
    login_password: "{{ database_credentials.db_root_password }}"
  delegate_to: "{{ postgres_host }}"
  when: db_check.rowcount > 0 # ← skip if DB doesn't exist

- name: "Delete database {{ database_name }} on {{ postgres_host }}"
  community.postgresql.postgresql_db:
    name: "{{ database_name }}"
    state: absent
    force: true
    login_host: "{{ postgres_host }}"
    login_port: "{{ postgres_port }}"
    login_user: "{{ database_credentials.db_root_user }}"
    login_password: "{{ database_credentials.db_root_password }}"
  delegate_to: "{{ postgres_host }}"

- name: "Delete user {{ database_user }} on {{ postgres_host }}"
  community.postgresql.postgresql_user:
    name: "{{ database_user }}"
    state: absent
    login_host: "{{ postgres_host }}"
    login_port: "{{ postgres_port }}"
    login_user: "{{ database_credentials.db_root_user }}"
    login_password: "{{ database_credentials.db_root_password }}"
  delegate_to: "{{ postgres_host }}"
