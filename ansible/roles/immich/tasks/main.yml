---
- name: Setup disks for {{ immich_app_name }}
  ansible.builtin.import_role:
    name: os_debian
    tasks_from: setup_additional_disks.yml
  vars:
    disks:
      - scsi_num: 2
        mount_path: "{{ immich_mount_dir }}"

- name: Generate and store {{ immich_app_name }} secrets in vault
  ansible.builtin.import_tasks: secrets_generate.yml

- name: Fetch {{ immich_app_name }} secrets from vault
  ansible.builtin.import_tasks: secrets_fetch.yml

- name: Setup podman user
  ansible.builtin.import_role:
    name: podman
    tasks_from: setup_rootless_users.yml
  vars:
    podman_users:
      - name: "{{ immich_service_user }}"
        home: "/home/{{ immich_service_user }}"

- name: Setup directories
  ansible.builtin.import_tasks: directories.yml

- name: Deploy containers
  ansible.builtin.import_tasks: containers.yml

- name: Wait for {{ immich_app_name }} to be reachable on port {{ immich_port }}
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ immich_port }}"
    state: started
    timeout: 120
    delay: 10

- name: Configure NPM proxy host
  ansible.builtin.import_role:
    name: nginx_proxy_manager
    tasks_from: proxy_hosts.yml
  vars:
    npm_proxy_hosts:
      - domain_names:
          - "{{ immich_app_domain }}"
        forward_host: "{{ ansible_host }}"
        forward_port: "{{ immich_port }}"
