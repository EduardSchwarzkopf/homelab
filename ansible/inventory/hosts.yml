# inventory/hosts.yml
all:
  children:
    postgres_host:
      hosts:
        postgres_server:
          ansible_host: database-pg-prod
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/projects/homelab/tofu/infrastructure/keys/database-pg-prod.key

    podman_hosts:
      vars:
        ansible_user: debian
        ansible_ssh_private_key_file: ~/projects/homelab/priv.key
      hosts:
        plane:
          ansible_host: plane.lan
        docmost:
          ansible_host: docmost.lan
