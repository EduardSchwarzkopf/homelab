- name: Deploy productivity apps on office server via Podman
  hosts: office
  roles:
    - role: apps/leafwiki
    - role: apps/plane
    - role: apps/paperless

- name: Deploy media apps on media server via Podman
  hosts: media
  roles:
    - role: apps/immich

- name: Deploy hermes-agent on AI server
  hosts: ai

  roles:
    - role: hermes_agent

- name: Setup retrogames archives
  hosts: media
  roles:
    - role: retrogames
