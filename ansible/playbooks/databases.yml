- name: Setup databases
  hosts: database
  roles:
    - role: postgres
  vars:
    postgres_instances:
      - name: postgres
        image: docker.io/library/postgres:17.6
        scsi_num: 1
        port: 5432

      - name: postgres-vectorchord
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
        scsi_num: 2
        port: 5433
        extra_env:
          POSTGRES_INITDB_ARGS: "--data-checksums"
