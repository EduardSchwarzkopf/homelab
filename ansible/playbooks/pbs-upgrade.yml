---
- name: Upgrade Proxmox Backup Server on backup VM
  hosts: backup

  tasks:
    - name: Show latest available version
      ansible.builtin.command: proxmox-backup-manager versions --format json
      register: latest_version
      changed_when: false
      failed_when: false

    - name: Display latest version
      ansible.builtin.debug:
        msg: "{{ latest_version.stdout }}"
      when: latest_version.rc == 0

    - name: Run distribution upgrade
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true

    - name: Verify installed versions
      ansible.builtin.command: proxmox-backup-manager versions
      register: versions_output
      changed_when: false

    - name: Show versions output
      ansible.builtin.debug:
        var: versions_output.stdout_lines

    - name: Reboot the server
      ansible.builtin.reboot:
        msg: "Rebooting after Proxmox Backup Server upgrade"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime